<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulso — triagem de apoio</title>
<style>
:root{--bg:#F8F9FA;--pri:#4A90E2;--tx:#1f2933;--card:#fff;--btx:#fff}
body[data-tema=taquicardia]{--bg:#EBF2F7;--pri:#2B5B84;--card:#F0F4F8}
body[data-tema=agitacao]{--bg:#F0F7F4;--pri:#6B9080;--card:#F6FFF8}
body[data-tema=noite]{--bg:#1E1B2E;--pri:#9D8DF1;--tx:#E2C2B9;--card:#2D2A4A;--btx:#1E1B2E}
body[data-tema=crise]{--bg:#006D77;--pri:#EDF6F9;--tx:#EDF6F9;--card:#04565e;--btx:#006D77}
body[data-tema=poscrise]{--bg:#FBF3E4;--pri:#E07A5F;--card:#F2CC8F55}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background 2s,color 2s}
main{max-width:560px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;margin:4px 4px 4px 0;background:var(--pri);color:var(--btx);cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid currentColor}
button.big{display:block;width:100%;font-size:20px;padding:16px}
input[type=number]{font:inherit;padding:10px;width:8em}
small,.aviso{opacity:.8;font-size:14px}
.opc button{min-width:56px}
.bar{height:6px;background:#0002;border-radius:3px}.bar i{display:block;height:100%;background:var(--pri);border-radius:3px}
#resp{width:160px;height:160px;border-radius:50%;margin:24px auto;background:radial-gradient(#6B9080,#2B5B84);animation:resp 10s ease-in-out infinite}
@keyframes resp{0%{transform:scale(.6)}40%{transform:scale(1)}100%{transform:scale(.6)}}
canvas{width:100%;height:120px;background:var(--card);border-radius:10px}
.log{font:13px monospace;max-height:220px;overflow:auto;background:#fff;color:#222;padding:8px;border-radius:8px}
.chip{padding:1px 6px;border-radius:6px;color:#fff}.chip.vermelho{background:#C62828}.chip.amarelo{background:#EF6C00}.chip.verde{background:#2E7D32}
</style>
</head>
<body data-tema="normal">
<main id="app">Carregando…</main>
<script src="app.js"></script>
</body>
</html>
