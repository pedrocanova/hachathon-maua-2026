<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulso — classificação de risco</title>
<style>
/* Temas do Guia de Psicologia das Cores: escolha de design para ambiente calmo, sem efeito fisiológico comprovado.
   O paciente nunca vê vermelho/amarelo vibrantes; sem branco puro. Paletas mantidas; só a cor de TEXTO foi ajustada
   para contraste WCAG >= 4,5:1 (ex.: texto escuro sobre sálvia e sobre coral). */
:root{--bg:#F8F9FA;--pri:#4A90E2;--tx:#1f2933;--card:#FDFDFD;--btx:#0B2545}
body[data-tema=taquicardia]{--bg:#EBF2F7;--pri:#2B5B84;--card:#F0F4F8;--btx:#fff}
body[data-tema=agitacao]{--bg:#F0F7F4;--pri:#6B9080;--card:#F6FFF8;--btx:#0F2419}
body[data-tema=noite]{--bg:#1E1B2E;--pri:#9D8DF1;--tx:#E2C2B9;--card:#2D2A4A;--btx:#1E1B2E}
body[data-tema=crise]{--bg:#006D77;--pri:#EDF6F9;--tx:#EDF6F9;--card:#04565e;--btx:#00434a}
body[data-tema=poscrise]{--bg:#FBF3E4;--pri:#E07A5F;--tx:#3B1D12;--card:#F2CC8F;--btx:#2B130A}
*{box-sizing:border-box}
body{margin:0;font:18px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background 2s,color 2s;padding-top:calc(64px + env(safe-area-inset-top,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:1.5em;line-height:1.2}
h2{font-size:1.15em;margin-top:0}
.card{display:block;background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
button,.btn{display:inline-block;font:inherit;border:0;border-radius:12px;padding:14px 18px;margin:4px 4px 4px 0;background:var(--pri);color:var(--btx);cursor:pointer;text-decoration:none;text-align:center}
button.sec,.btn.sec{background:transparent;color:var(--tx);border:1px solid currentColor}
.big{display:block;width:100%;font-size:1.1em;padding:16px;margin:8px 0}
.opc{display:flex;flex-direction:column;gap:8px}
.opc .op{display:block;width:100%;margin:0;text-align:left;padding:16px;min-height:56px;background:transparent;color:var(--tx);border:2px solid var(--pri)}
.opc .op[aria-pressed=true]{background:var(--pri);color:var(--btx)}
.opc .op:hover{outline:2px solid var(--pri)}
.opc.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}
.opc.grade .op{text-align:center;padding:14px 0}
label{display:block;margin:8px 0}
label input:not([type=checkbox]),input[type=number]{display:block;width:100%;font:inherit;padding:12px;margin:4px 0 8px;border-radius:10px;border:1px solid #8889}
.check{display:flex;gap:12px;align-items:flex-start}.check input{width:24px;height:24px;flex:none;margin-top:2px}
small,.aviso{font-size:15px}
.bar{height:8px;background:#0002;border-radius:4px}.bar i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
#resp{width:160px;height:160px;border-radius:50%;margin:24px auto;background:radial-gradient(#6B9080,#2B5B84);animation:resp 10s ease-in-out infinite}
@keyframes resp{0%{transform:scale(.6)}40%{transform:scale(1)}100%{transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){#resp{animation-duration:20s}}
canvas{width:100%;height:120px;background:var(--card);border-radius:10px}
/* barra superior: SOS visível em todas as telas; engrenagem = Perfil e dados */
#topo{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--card);border-bottom:1px solid #8885;display:flex;gap:8px;align-items:center;z-index:35}
#topo b.marca{flex:1}
#topo button{margin:0;padding:10px 14px}
#sos{font-weight:700;letter-spacing:.05em;min-width:84px}
#sosconf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
/* navegação inferior: 5 abas, ícone com rótulo de texto */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid #8885;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
#nav button{flex:1;min-width:0;margin:0;padding:8px 2px;border-radius:0;background:transparent;color:var(--tx);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
#nav button span{font-size:22px;line-height:1}
#nav button[aria-current=page]{font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duas button{margin:0}
.ajuste{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.ajuste label{margin:0}.ajuste select{margin:4px 0 0}
#ema{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:72px 16px 24px}
#alerta,#escala{position:fixed;inset:0;background:var(--bg);color:var(--tx);z-index:30;overflow:auto;padding:76px 16px 24px}
#escala{z-index:40}
.tela{max-width:560px;margin:auto}
.tl{padding-left:20px}.tl li{margin:10px 0}.tl li.feito::marker{content:'✓  '}.tl li.pendente::marker{content:'…  '}
.procure{border:2px solid var(--pri);border-radius:12px;padding:8px 12px;margin-top:12px}
h3{font-size:1em;margin:12px 0 4px}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:560px;margin:auto;background:var(--card);color:var(--tx);border:2px solid var(--pri);border-radius:12px;padding:12px 16px;z-index:50}
#emacorpo{max-width:560px;margin:auto;background:var(--bg);border-radius:16px;padding:12px 16px}
.destaque{font-size:1.25em;font-weight:600;margin:0 0 8px}
.vivo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vivo canvas,.vivo p,.vivo>small{grid-column:1/-1}
.num{display:block;font-size:1.6em}
.tab{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card)}td,th{padding:8px;border-bottom:1px solid #8884;text-align:left}
select{display:block;width:100%;font:inherit;padding:10px;margin:4px 0 8px;border-radius:10px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:320px;overflow:auto}
@media print{#topo,#nav,#ema,#alerta,#escala,#toast,button,details>summary{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:1px solid #999}}
/* painel do profissional: aqui sim vermelho/laranja para priorização */
.log{font:13px monospace;max-height:240px;overflow:auto;background:#FDFDFD;color:#222;padding:8px;border-radius:8px}
.chip{padding:2px 8px;border-radius:6px;color:#fff;font-size:14px}.chip.vermelho{background:#C62828}.chip.amarelo{background:#EF6C00;color:#1A0A00}.chip.verde{background:#2E7D32}
[hidden]{display:none!important}
</style>
</head>
<body data-tema="normal">
<main id="app">Carregando…</main>
<div id="ema" role="dialog" aria-modal="true" aria-label="Check-in" hidden><div id="emacorpo"></div></div>
<div id="alerta" role="alertdialog" aria-modal="true" aria-label="Check-in de segurança" hidden></div>
<div id="escala" role="alertdialog" aria-modal="true" aria-label="Acionando ajuda" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<header id="topo" hidden>
  <b class="marca">Pulso</b>
  <button class="sec" id="engrenagem" aria-label="Perfil e dados"><span aria-hidden="true">⚙&#xFE0E;</span> Dados</button>
  <button id="sos" aria-label="SOS: pedir ajuda agora">SOS</button>
  <span id="sosconf" role="alertdialog" aria-label="Confirmar SOS" hidden><b>Pedir ajuda?</b><button id="sosSim">Sim</button><button class="sec" id="sosNao">Cancelar</button></span>
</header>
<nav id="nav" aria-label="Navegação" hidden></nav>
<script src="app.js"></script>
</body>
</html>
